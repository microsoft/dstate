[package]
name = "dstate-dactor"
version = "1.1.1"
edition = "2021"
rust-version = "1.89"
description = "dactor actor hosting for dstate distributed state replication"
license = "MIT"
repository = "https://github.com/Yaming-Hub/dstate"
homepage = "https://github.com/Yaming-Hub/dstate"
readme = "../README.md"
keywords = ["distributed", "state", "actor", "dactor", "replication"]
categories = ["concurrency", "network-programming"]

[dependencies]
dstate = { path = "../dstate", version = "1.1.1" }
dactor = { version = "0.3", features = ["serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["time", "sync", "rt"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
dactor = { version = "0.3", features = ["serde", "test-support"] }
dactor-mock = "0.3"
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full", "test-util"] }
